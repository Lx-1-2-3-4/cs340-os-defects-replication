name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: liuxin1240013249
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check the dataset snapshot
        run: python scripts/fetch_data.py --check

      - name: Run the reproduction and validate
        run: |
          make reproduce
          make validate

      - name: Run the extension experiments
        run: make extension

  preprocessing-audit:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Test and reproduce preprocessing sensitivity
        run: python -B wuyanyang1240009531/scripts/run_all.py

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessing-audit-1240009531
          path: wuyanyang1240009531/results/
          if-no-files-found: warn

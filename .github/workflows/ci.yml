name: reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: liuxin1240013249
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: Check the dataset snapshot
        run: python scripts/fetch_data.py --check

      - name: Run the reproduction and validate
        run: |
          make reproduce
          make validate
